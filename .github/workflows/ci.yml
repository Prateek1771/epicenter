name: ci
on: [push, pull_request]

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:v4.22.1   # keep in step with FALKORDB_TAG in .env.example
        env:
          REDIS_ARGS: "--requirepass ci"
          BROWSER: "0"
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli -a ci --no-auth-warning PING"
          --health-interval 5s --health-retries 10
    env:
      FALKORDB_URL: redis://:ci@localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: api/requirements*.txt }
      - run: pip install -r api/requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: python -m api.smoke_falkordb
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
