# Epicenter's nginx for flip-commerce: the repo's routing (/node/ → 01-node, prefix stripped) without brotli
# (needs a module build) and without the 15 s proxy cache (it would serve stale 200s through a Mongo outage).
worker_processes 1;
events { worker_connections 2048; }

http {
    # api/ingest/otel.py parses this format: request end time, request, status, total time, upstream, upstream time
    log_format epicenter '$msec "$request" $status $request_time $upstream_addr $upstream_response_time';
    access_log /var/log/epicenter/access.log epicenter;

    upstream node { server flip-host:5001; keepalive 32; }

    server {
        listen 8080;
        location /node/ {
            proxy_pass http://node/;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 35s;  # the app answers 503 after its own 30 s request timeout
        }
        location = /health { return 200 "ok\n"; }
    }
}
